# Cada vez que se sube un cambio: publica la web y arma el APK de Android.
name: Web y APK de Hocico
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: hocico
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar la librería de QR dentro de la app
        run: curl -sSfL https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js -o www/qrcode.min.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar Capacitor
        run: npm install
      - name: Crear el proyecto Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#56662b' --splashBackgroundColor '#f2f3e8' || true
          npx cap sync android
      - name: Armar el APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../hocico.apk
      - name: Publicar el APK para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Hocico (versión de prueba)
          body: Descargá hocico.apk en tu celular Android para instalar la app.
          prerelease: true
          files: hocico.apk
          make_latest: true
      - name: Preparar la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: www
  web:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
